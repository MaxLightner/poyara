name: Validate and package preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify:dist
      - name: Save static preview
        uses: actions/upload-artifact@v4
        with:
          name: poyara-static-preview
          path: dist/
          if-no-files-found: error
